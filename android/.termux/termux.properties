# Termux app settings. Apply with: termux-reload-settings

# Extra-keys row above the soft keyboard. Hardware keyboard (Glove80) makes
# most of these redundant, but they're a nice fallback when you're holding
# the tablet without the keyboard.
extra-keys = [['ESC','/','-','HOME','UP','END','PGUP'], \
              ['TAB','CTRL','ALT','LEFT','DOWN','RIGHT','PGDN']]

# Volume keys behave as volume (not as ctrl modifier) since the Glove80
# already provides a real ctrl. Switch to "virtual" if you ever go bare.
volume-keys = volume

# Allow Termux:Widget / Termux:Tasker / Termux:API to talk to this Termux.
allow-external-apps = true

# Long press to select; bell silenced.
bell-character = ignore

# Cursor + transcript
terminal-cursor-style = bar
terminal-cursor-blink-rate = 500
terminal-transcript-rows = 5000

# Margins
terminal-margin-horizontal = 4
terminal-margin-vertical = 4

# Soft back button = ESC. Makes vim/nvim usable when keyboardless.
back-key = escape

# Default working directory when launching from a widget
default-working-directory = /data/data/com.termux/files/home
