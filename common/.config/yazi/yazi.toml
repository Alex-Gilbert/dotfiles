# Defaults cover edit ($EDITOR), archives (ya pub extract), audio/video (play), fallback (xdg-open).
# Only override what should NOT go through xdg-open.
[opener]
image      = [{ run = 'imv %s', orphan = true, for = "linux" }, { run = 'open %s', for = "macos" }]
video      = [{ run = 'vlc %s', orphan = true, for = "linux" }, { run = 'open %s', for = "macos" }]
smart-edit = [{ run = 'edit-file %s' }]

[open]
prepend_rules = [
    { mime = "image/*", use = ["image", "reveal"] },
    { mime = "video/*", use = ["video", "reveal"] },
]
