; fish-ai — LLM assistance in fish.
;
; Points at the local ollama instance, so no prompt, command buffer, file
; content, or history ever leaves the machine. Nothing here is a secret;
; if a cloud provider is ever added, put the key in the keyring with
; `fish_ai_put_api_key` rather than inlining api_key = here.

[fish-ai]
configuration = ollama

; keymap_1 / keymap_2 are bound by fish-ai in BOTH insert and default mode.
; That's why `?` is not set here -- it would stop `?` being typeable in insert
; mode (globs, URLs, test -n). config.fish binds `?` in default mode only,
; after this plugin's conf.d has run. ctrl-space keeps autocomplete-or-fix.
keymap_1 = ctrl-p
keymap_2 = ctrl-space

; Shown at the right edge while the model is thinking.
progress_indicator = 🤖

[ollama]
provider = self-hosted
server = http://localhost:11434/v1

; qwen2.5-coder:7b, not qwen3:30b. qwen3 is a reasoning model: it spent 791
; tokens and 2.5s on "find files over 100MB", emitting the answer after a
; </think> tag. The coder model answers the same prompt in 13 tokens / 0.2s
; with no reasoning to strip. Latency is the whole point on a keybinding.
model = qwen2.5-coder:7b
