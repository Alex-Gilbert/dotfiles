# ============================================================================
# Prefix Configuration
# ============================================================================

# Set True color
set-option -sa terminal-overrides ",xterm-256color:Tc"

# Set prefix to Alt+Space
unbind C-b
set -g prefix M-Space
bind M-Space send-prefix

# Required for Yazi and other modern TUI tools
set -g allow-passthrough on

# Ensure tmux knows your terminal supports true color
set -as terminal-features ',xterm-256color:RGB'

# Update environment variables for better detection
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
# Scrub SSH_* on local re-attach so panes don't think they're remote
# (SSH_CONNECTION is already in tmux's default update-environment list)
set -ga update-environment SSH_CLIENT
set -ga update-environment SSH_TTY

# ============================================================================
# TPM (Tmux Plugin Manager)
# ============================================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'niksingh710/minimal-tmux-status'
set -g @plugin 'fcsonline/tmux-thumbs'

# Session persistence. A tmux server leaves no trace when it dies and sessions
# go with it -- resurrect snapshots them, continuum saves on a timer and
# restores automatically when the server next starts.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'   # keep scrollback, not just layout
set -g @resurrect-strategy-nvim 'session'      # reopen nvim with its session
set -g @continuum-save-interval '5'            # minutes
set -g @continuum-restore 'on'

# Floating pane configuration (per-session persistent float)
set -g @float-width '80%'
set -g @float-height '80%'
set -g @float-border-color '#98bb6c'
set -g @float-text-color '#dcd7ba'

# TPM keybindings (using prefix for admin tasks)
bind i run-shell '~/.config/tmux/plugins/tpm/bindings/install_plugins'
bind u run-shell '~/.config/tmux/plugins/tpm/bindings/update_plugins'
bind C run-shell '~/.config/tmux/plugins/tpm/bindings/clean_plugins'

# tmux-thumbs
run-shell ~/.config/tmux/plugins/tmux-thumbs/tmux-thumbs.tmux
if-shell 'test "$(uname)" = "Darwin"' {
    set -g @thumbs-command 'echo -n {} | pbcopy'
    set -g @override_copy_command 'pbcopy'
}

if-shell 'test "$(uname)" = "Linux"' {
    if-shell 'test -n "$WAYLAND_DISPLAY"' {
        set -g @thumbs-command 'echo -n {} | wl-copy'
    } {
        set -g @thumbs-command 'echo -n {} | xclip -sel clipboard'
    }
}

# ============================================================================
# General Settings
# ============================================================================

# Enable mouse support
set -g mouse on

set-option -g history-limit 50000
set-option -g display-time 4000
set-option -g status-interval 5

# address vim mode switching delay (http://superuser.com/a/252717/65504)
set-option -s escape-time 0

# Enable 256 color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# No delay for escape key
set -sg escape-time 0

# Enable clipboard
set -s set-clipboard on

# Enable focus events for vim/neovim
set -g focus-events on

set-window-option -g aggressive-resize on

# ============================================================================
# Keybindings (matching Zellij Alt-based bindings)
# ============================================================================

# Unbind default prefix (Ctrl-b)
unbind C-b
# No prefix needed since we're using Alt everywhere

# ============================================================================
# Pane Creation (Alt + hjkl like Zellij)
# ============================================================================

bind -n M-h split-window -hb -c "#{pane_current_path}"  # left
bind -n M-j split-window -v -c "#{pane_current_path}"   # down
bind -n M-k split-window -vb -c "#{pane_current_path}"  # up
bind -n M-l split-window -h -c "#{pane_current_path}"   # right

# ============================================================================
# Tab Navigation (Alt + number like Zellij)
# ============================================================================

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# ============================================================================
# Tab Management (matching Zellij Alt-t mode)
# ============================================================================

# Enter "tab mode" with Alt-t, then use single keys
bind -n M-t switch-client -T tab-mode

bind -T tab-mode n new-window -c "#{pane_current_path}"
bind -T tab-mode x kill-window
bind -T tab-mode r command-prompt -I "#W" "rename-window '%%'"
bind -T tab-mode h previous-window
bind -T tab-mode l next-window
bind -T tab-mode Tab last-window
bind -T tab-mode s set-window-option synchronize-panes\; display-message "Sync: #{?synchronize-panes,ON,OFF}"

# ============================================================================
# Pane Management (matching Zellij Alt-a mode)
# ============================================================================

bind -n M-a switch-client -T pane-mode

bind -T pane-mode z resize-pane -Z  # toggle zoom (fullscreen)
bind -T pane-mode f resize-pane -Z  # same as z

# ============================================================================
# Move Mode (matching Zellij Alt-m mode)
# ============================================================================

bind -n M-m switch-client -T move-mode

# Resize panes
bind -T move-mode H resize-pane -L 5
bind -T move-mode J resize-pane -D 5
bind -T move-mode K resize-pane -U 5
bind -T move-mode L resize-pane -R 5
bind -T move-mode M-h resize-pane -L 1
bind -T move-mode M-j resize-pane -D 1
bind -T move-mode M-k resize-pane -U 1
bind -T move-mode M-l resize-pane -R 1

# Swap panes
bind -T move-mode h swap-pane -U
bind -T move-mode j swap-pane -D
bind -T move-mode k swap-pane -U
bind -T move-mode l swap-pane -D

# ============================================================================
# Session Management (matching Zellij Alt-g mode)
# ============================================================================

bind -n M-g switch-client -T session-mode

bind -T session-mode d detach-client
bind -T session-mode g choose-tree -Zs

# ============================================================================
# Scroll Mode (matching Zellij Alt-s)
# ============================================================================

bind -n M-s run-shell "tmux capture-pane -pS - | sed '/^$/d' > /tmp/tmux-buffer && tmux new-window 'nvim +\\$ -c \"luafile ~/.config/nvim/lua/alex-config/tmux-yank-close.lua\" /tmp/tmux-buffer'"

# ============================================================================
# Floating Panes (using tmux-floax plugin)
# ============================================================================

# Alt+w for floating popup terminal (per-session persistent float)
bind -n M-w run-shell '~/.config/tmux/scripts/floating-pane.sh'

# Alt+f for floating file picker popup
bind -n M-f display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "yazi-tmux-picker #{pane_id}"

# Alt+v toggles voice dictation. Records on whichever device this client is
# SSH'd in from (resolved via SSH_CONNECTION -> tailscale), transcribes and
# polishes here, then types the result into this pane without Enter.
# M-t was not free: it is tab-mode above.
#
# run-shell -b, not display-popup: a popup has to own the terminal to read a
# keypress, and with `mouse on` the escape sequences that generates were read
# as cancel, closing it the instant it appeared. State lives in the status bar
# instead, via @voice_rec below -- nothing to close, no keyboard to capture.
bind -n M-v run-shell -b "voice-dictate #{pane_id} #{client_pid}"

# The recording indicator. minimal-tmux-status composes this into status-right,
# and #{@voice_rec} is re-evaluated on every status redraw, so the script only
# has to set the option.
set -g @voice_rec ""
set -g @minimal-tmux-status-right-extra "#{@voice_rec}"

# ============================================================================
# Other Zellij-like bindings
# ============================================================================

# Alt+x - kill pane (but not if it's the last one)
bind -n M-x if-shell '[ $(tmux list-panes | wc -l) -gt 1 ]' \
    'if-shell "tmux display-message -p \"#{pane_current_command}\" | grep -iq nvim" \
        "confirm-before -p \"Kill pane running nvim? (y/n)\" kill-pane" \
        "kill-pane"' \
    'display-message "Cannot close last pane"'

# Alt+d - detach from session
bind -n M-d detach-client

# Alt+q - quick detach (keeping old binding)
bind -n M-q detach-client

# M-D (kill-session) and M-Q (kill-server) used to live here, one Shift away
# from the detaches above and needing no prefix. On a phone keyboard, where
# Alt is a sticky key in the extra-keys row, that is a loaded gun -- and
# confirm-before only helps if you read it before hitting y.
#
# Destructive commands now require the prefix. See "prefix + K" below;
# killing the whole server is rare enough to just type: tmux kill-server
#
# Explicit unbinds: source-file only adds bindings, so deleting the lines
# would leave them live on an already-running server until the next restart.
unbind -n M-D
unbind -n M-Q


# ============================================================================
# Prefix-based Administrative Commands
# ============================================================================

# Prefix + r - reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# Locked mode (Alt-o to toggle)
bind L set-option -g prefix None \; set-option -g key-table locked \; display-message "LOCKED"
bind -T locked L set-option -g prefix M-Space \; set-option -g key-table root \; display-message "UNLOCKED"

# Prefix + : - command prompt
bind : command-prompt

# Prefix + ? - show all keybindings
bind ? list-keys

# Prefix + I - show tmux info
bind I display-message "tmux #{version}"

# Prefix + K - kill this session (was M-D, moved behind the prefix)
bind K confirm-before -p "Kill session #S? (y/n)" kill-session

# Prefix + Shift+D - detach all other clients
bind D detach-client -a

# Prefix + Shift+Q - kill all other sessions
bind Q confirm-before -p "Kill all other sessions? (y/n)" "kill-session -a"

# ============================================================================
# Visual Styling (minimal centered pill-style status bar)
# ============================================================================

# automatic rename
setw -g automatic-rename on

# arrow styles (rounded box)
set -g @minimal-tmux-use-arrow true
set -g @minimal-tmux-right-arrow ""
set -g @minimal-tmux-left-arrow ""

# copy mode
setw -g mode-style bg=#2d4f67,fg=#dcd7ba

# clock mode
setw -g clock-mode-colour "#7e9cd8"

# ============================================================================
# Additional Quality of Life
# ============================================================================

# Prefix-based split commands (traditional tmux style)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind l split-window -h -c "#{pane_current_path}"
bind j split-window -v -c "#{pane_current_path}"

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Prefix + x - kill pane with confirmation
bind x confirm-before -p "Kill pane? (y/n)" kill-pane

# Prefix + & - kill window with confirmation  
bind & confirm-before -p "Kill window? (y/n)" kill-window

# Clear screen and history
bind -n M-C-l send-keys C-l \; clear-history

# ============================================================================
# LOOM tmux plugin
# ============================================================================
# Sources loom-specific bindings + session-created hook for `loom/*`
# sessions. Sourced BEFORE TPM so existing `bind L` (lock) stays
# yours; loom uses `prefix + b` as the back-to-prev binding instead.
# Other bindings:
#   prefix + g   →  chooser limited to loom/* sessions
#   prefix + G   →  chooser limited to non-loom sessions

# source-file /home/alex/dev/loom/share/tmux/loom.conf

# ============================================================================
# Initialize TPM (must be at the very end)
# ============================================================================

run '~/.config/tmux/plugins/tpm/tpm'
