# Desktop (iGPU drives sway; nvidia stays cold for X11/i3 sessions)
#
# Cable-as-switch: one DP cable, moved between mobo DP (sway day) and the
# nvidia card (i3 day). Mobo DP lands on amdgpu DP-4/5/6 depending on port,
# so match any output — single-monitor box. Verify the 240 took with
# `swaymsg -t get_outputs`; drop the rate if the iGPU link can't carry it.

# ========== OUTPUT ==========
output * mode 3840x2160@240Hz pos 0 0 scale 1.5

# Recording: actual 1080p pixels, with no fractional desktop scaling.
bindsym $hyp+F9 output * mode 1920x1080@60Hz scale 1
bindsym $hyp+F10 output * mode 3840x2160@240Hz scale 1.5

# ========== IDLE ==========
# lock only — no hibernate on the desktop
exec swayidle -w \
    timeout 600  'gtklock -d' \
    before-sleep 'gtklock -d'

font pango:JetBrainsMono Nerd Font 10
