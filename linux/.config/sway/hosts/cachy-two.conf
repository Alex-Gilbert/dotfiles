# Desktop (iGPU drives sway; nvidia stays cold for X11/i3 sessions)
#
# Mobo HDMI (amdgpu card0) -> monitor HDMI-2 input. EDID tops out at
# 3840x2160@120 on HDMI (240 is DP-only). If the mobo port is HDMI 2.0
# it may only manage 60 — check `swaymsg -t get_outputs` on first boot.

# ========== OUTPUT ==========
output HDMI-A-2 mode 3840x2160@120Hz pos 0 0

# ========== IDLE ==========
# lock only — no hibernate on the desktop
exec swayidle -w \
    timeout 600  'gtklock -d' \
    before-sleep 'gtklock -d'
