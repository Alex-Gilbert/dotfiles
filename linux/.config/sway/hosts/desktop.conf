# Desktop (iGPU drives sway; nvidia stays cold for X11/i3 sessions)
#
# Fill in the output line once you're on the machine:
#   swaymsg -t get_outputs
# The connector name on the iGPU will likely be DP-1 or HDMI-A-1.
# i3/X11 side runs 3840x2160@240 on the nvidia card; the iGPU port may
# cap at a lower refresh rate — check `swaymsg -t get_outputs` modes.

# ========== OUTPUT ==========
# output DP-1 mode 3840x2160@120Hz pos 0 0

# ========== IDLE ==========
# lock only — no hibernate on the desktop
exec swayidle -w \
    timeout 600  'gtklock -d' \
    before-sleep 'gtklock -d'
