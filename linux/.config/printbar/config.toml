[printer.office]
host = "192.168.1.16"
cups = "OfficejetPro8600"

[printer.office.snmp]
enabled = true
community = "public"

[printer.office.bar]
format = "󰐪 {jobs}"
on_missing = "hide"

[printer.office.tooltip]
items = ["model", "status", "alerts", "display", "supplies", "paper", "jobs", "impressions"]
max_rows = 12
tooltip_font = "JetBrainsMono Nerd Font Mono, JetBrainsMono Nerd Font, monospace"

[printer.office.actions]
on_click = "ews"
on_click_right = "queue"
